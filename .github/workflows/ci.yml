name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src
      - run: pytest --cov=facetroute --cov-branch
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: ruff check src tests examples
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: mypy -p facetroute
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          facetroute calibrate --traces examples/traces.jsonl --max-average-cost 0.003 --output /tmp/calibration.json --csv /tmp/calibration.csv
          facetroute benchmark --models examples/models.json --preferences examples/preferences.json --rules examples/rules.json --traces examples/traces.jsonl --bootstrap-samples 100 --output-dir /tmp/benchmark
          test -s /tmp/benchmark/benchmark.html
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python -m build
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import facetroute; print(facetroute.__version__)"
          facetroute --help
