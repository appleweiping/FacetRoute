name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.31"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run --locked python -m compileall -q src scripts
      - run: uv run --locked pytest --cov=facetroute --cov-branch --cov-report=json:coverage.json
      - run: uv run --locked python scripts/check_branch_coverage.py coverage.json
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: uv run --locked ruff check src tests examples scripts
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: uv run --locked ruff format --check src tests examples scripts
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: uv run --locked mypy -p facetroute
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: uv run --locked bandit -q -c pyproject.toml -r src
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: uv audit --locked
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          uv run --locked facetroute-mmlu-prepare \
            --dev examples/mmlu_csv/demo_math_dev.csv \
            --test examples/mmlu_csv/demo_math_test.csv \
            --subject demo_math \
            --dev-sha256 60812464d52bd3c5b379d48956ab903e9bab3cd239375f8c0dc3cbe4c4a19082 \
            --test-sha256 33ac8df529bf4b1d3b36b8fa25cdadd5b297f419b1751a1dfdaa3abf45fa02fa \
            --dev-source-uri repository:examples/mmlu_csv/demo_math_dev.csv \
            --test-source-uri repository:examples/mmlu_csv/demo_math_test.csv \
            --license MIT --shots 2 --max-prompt-bytes 8192 \
            --output /tmp/facet-prepared-mmlu.jsonl > /tmp/facet-mmlu-evidence.json
          uv run --locked python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from facetroute import MMLUCSVPreparationPlan, verify_mmlu_csv_preparation
          from facetroute.public_scores import PublicScoreProvenance
          root = Path('examples/mmlu_csv')
          dev = (root / 'demo_math_dev.csv').read_bytes()
          test = (root / 'demo_math_test.csv').read_bytes()
          plan = MMLUCSVPreparationPlan(
              'demo_math',
              PublicScoreProvenance('repository:examples/mmlu_csv/demo_math_dev.csv', 'MIT', hashlib.sha256(dev).hexdigest()),
              PublicScoreProvenance('repository:examples/mmlu_csv/demo_math_test.csv', 'MIT', hashlib.sha256(test).hexdigest()),
              requested_shots=2,
          )
          artifact = Path('/tmp/facet-prepared-mmlu.jsonl').read_bytes()
          evidence = Path('/tmp/facet-mmlu-evidence.json').read_bytes()
          assert verify_mmlu_csv_preparation(artifact, evidence, dev, test, plan, dev_name='demo_math_dev.csv', test_name='demo_math_test.csv')
          assert json.loads(evidence)['selected_shots'] == 2
          PY
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          uv run --locked facetroute-mmlu-suite \
            --manifest examples/mmlu_csv/suite-demo.json \
            --output /tmp/facet-mmlu-suite.jsonl > /tmp/facet-mmlu-suite-evidence.json
          uv run --locked python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from facetroute import MMLUCSVPreparationPlan, MMLUSuiteSource, prepare_mmlu_suite
          from facetroute.public_scores import PublicScoreProvenance
          root = Path('examples/mmlu_csv')
          manifest = (root / 'suite-demo.json').read_bytes()
          sources = []
          for item in json.loads(manifest)['subjects']:
              dev = (root / item['dev']).read_bytes()
              test = (root / item['test']).read_bytes()
              plan = MMLUCSVPreparationPlan(
                  item['subject'],
                  PublicScoreProvenance(item['dev_source_uri'], item['license'], hashlib.sha256(dev).hexdigest()),
                  PublicScoreProvenance(item['test_source_uri'], item['license'], hashlib.sha256(test).hexdigest()),
                  requested_shots=item['shots'],
                  max_prompt_bytes=item['max_prompt_bytes'],
              )
              sources.append(MMLUSuiteSource(plan, dev, test))
          artifact = Path('/tmp/facet-mmlu-suite.jsonl').read_bytes()
          evidence = json.loads(Path('/tmp/facet-mmlu-suite-evidence.json').read_bytes())
          assert evidence['manifest_sha256'] == hashlib.sha256(manifest).hexdigest()
          prepared = prepare_mmlu_suite(sources)
          assert artifact == prepared.benchmark_jsonl()
          assert evidence['suite'] == json.loads(prepared.evidence_json())
          assert evidence['suite']['records'] == 2
          PY
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          uv run --locked facetroute-gsm8k-prepare \
            --train examples/gsm8k_jsonl/demo_train.jsonl \
            --test examples/gsm8k_jsonl/demo_test.jsonl \
            --train-sha256 17b17cf9b3ba412b9fc3100f224cc1970eb5670f73477183caeb891194af328b \
            --test-sha256 580469ea87331b36d023b6f54161909991d96eb2fa0578244f7ff485492c5ac1 \
            --train-source-uri repository:examples/gsm8k_jsonl/demo_train.jsonl \
            --test-source-uri repository:examples/gsm8k_jsonl/demo_test.jsonl \
            --license MIT --shots 2 --max-prompt-bytes 8192 \
            --output /tmp/facet-prepared-gsm8k.jsonl > /tmp/facet-gsm8k-evidence.json
          uv run --locked python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from facetroute import GSM8KJSONLPreparationPlan, verify_gsm8k_jsonl_preparation
          from facetroute.public_scores import PublicScoreProvenance
          root = Path('examples/gsm8k_jsonl')
          train = (root / 'demo_train.jsonl').read_bytes()
          test = (root / 'demo_test.jsonl').read_bytes()
          plan = GSM8KJSONLPreparationPlan(
              PublicScoreProvenance('repository:examples/gsm8k_jsonl/demo_train.jsonl', 'MIT', hashlib.sha256(train).hexdigest()),
              PublicScoreProvenance('repository:examples/gsm8k_jsonl/demo_test.jsonl', 'MIT', hashlib.sha256(test).hexdigest()),
              requested_shots=2,
          )
          artifact = Path('/tmp/facet-prepared-gsm8k.jsonl').read_bytes()
          evidence = Path('/tmp/facet-gsm8k-evidence.json').read_bytes()
          assert verify_gsm8k_jsonl_preparation(artifact, evidence, train, test, plan)
          assert json.loads(evidence)['selected_shots'] == 2
          PY
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          uv run --locked facetroute calibrate --traces examples/traces.jsonl --max-average-cost 0.003 --output /tmp/calibration.json --csv /tmp/calibration.csv
          uv run --locked facetroute split-traces --traces examples/traces.jsonl --output-dir /tmp/split --dataset-name "synthetic fixture" --source-uri "repository:examples/traces.jsonl" --license MIT --seed 8
          uv run --locked facetroute calibrate --traces /tmp/split/calibration.jsonl --held-out-traces /tmp/split/test.jsonl --max-average-cost 0.003 --output /tmp/held-out.json
          uv run --locked facetroute train-similarity --train-traces /tmp/split/train.jsonl --calibration-traces /tmp/split/calibration.jsonl --held-out-traces /tmp/split/test.jsonl --output /tmp/similarity.json --report /tmp/similarity-report.json
          uv run --locked facetroute train-factorization --train-traces /tmp/split/train.jsonl --held-out-traces /tmp/split/test.jsonl --output /tmp/factor-model.json --report /tmp/factor-report.json
          uv run --locked facetroute route --models examples/models.json --policy similarity --similarity-model /tmp/similarity.json --query "Explain a matrix proof" > /tmp/similarity-decision.json
          uv run --locked facetroute route --models examples/models.json --policy factorization --factor-model /tmp/factor-model.json --query "Explain a matrix proof" > /tmp/factor-decision.json
          uv run --locked facetroute benchmark --models examples/models.json --preferences examples/preferences.json --rules examples/rules.json --traces /tmp/split/test.jsonl --policy similarity --similarity-model /tmp/similarity.json --bootstrap-samples 100 --output-dir /tmp/benchmark
          uv run --locked facetroute benchmark --models examples/models.json --preferences examples/preferences.json --rules examples/rules.json --traces /tmp/split/test.jsonl --policy factorization --factor-model /tmp/factor-model.json --bootstrap-samples 100 --output-dir /tmp/factor-benchmark
          test -s /tmp/similarity-report.json
          test -s /tmp/similarity-decision.json
          test -s /tmp/factor-report.json
          test -s /tmp/factor-decision.json
          test -s /tmp/benchmark/benchmark.html
          test -s /tmp/factor-benchmark/benchmark.html
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          from facetroute.traces import file_sha256, load_traces, traces_sha256

          training = json.loads(Path("/tmp/similarity-report.json").read_text())
          decision = json.loads(Path("/tmp/similarity-decision.json").read_text())
          benchmark = json.loads(Path("/tmp/benchmark/benchmark.json").read_text())
          factor_training = json.loads(Path("/tmp/factor-report.json").read_text())
          factor_decision = json.loads(Path("/tmp/factor-decision.json").read_text())
          factor_benchmark = json.loads(Path("/tmp/factor-benchmark/benchmark.json").read_text())
          held_out = training["held_out"]
          metrics = benchmark["policies"]["similarity"]
          test_path = Path("/tmp/split/test.jsonl")
          test_traces = load_traces(test_path)
          sorted_test_traces = tuple(sorted(test_traces, key=lambda row: row.request.request_id))
          assert held_out["metrics"]["accuracy"] == 1.0
          assert benchmark["manifest"]["dataset_file_sha256"] == file_sha256(test_path)
          assert benchmark["manifest"]["dataset_canonical_sha256"] == traces_sha256(test_traces)
          assert held_out["dataset_canonical_sha256"] == traces_sha256(sorted_test_traces)
          assert benchmark["manifest"]["records"] == held_out["metrics"]["records"] == 1
          assert metrics["routed"] == metrics["requests"] == 1
          assert metrics["failure_rate"]["estimate"] == 0.0
          assert metrics["average_quality"]["estimate"] > 0.9
          assert decision["policy"] == "similarity"
          assert decision["selected_model"] == "marble-reasoner"
          assert decision["feature_summary"]["similarity"]["used"] is True
          assert factor_training["held_out"]["held_out_records"] == len(test_traces)
          assert factor_training["held_out"]["training_sha256"] == factor_training["training_sha256"]
          assert factor_decision["policy"] == "factorization"
          assert factor_decision["selected_model"] in factor_training["routes"]
          assert factor_benchmark["policies"]["factorization"]["routed"] == len(test_traces)
          assert "factor_model" in factor_benchmark["manifest"]["input_sha256"]
          PY
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: uv run --locked python -m build --no-isolation
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        shell: bash
        run: |
          python -m venv .ci-wheel-check
          .ci-wheel-check/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.whl
          .ci-wheel-check/bin/python -c "import facetroute; print(facetroute.__version__)"
          .ci-wheel-check/bin/python -c "from facetroute import AsyncRoutingController, AsyncProviderRegistry, ProviderResiliencePolicy, ResilientProviderRegistry; print('provider client imports ok')"
          .ci-wheel-check/bin/python -c "from facetroute.public_scores import PublicScoreLimits, run_public_scores; assert PublicScoreLimits().max_records == 1000; assert callable(run_public_scores)"
          .ci-wheel-check/bin/facetroute-public-score-live --help | grep -- --acknowledge-cost
          .ci-wheel-check/bin/facetroute-mmlu-prepare --help | grep -- --dev-sha256
          .ci-wheel-check/bin/facetroute-mmlu-suite --help | grep -- --manifest
          .ci-wheel-check/bin/facetroute-gsm8k-prepare --help | grep -- --train-sha256
          .ci-wheel-check/bin/facetroute-contamination-audit --help | grep -- --training
          .ci-wheel-check/bin/facetroute-contamination-exclusions \
            --source examples/contamination-questions.jsonl \
            --training examples/contamination-train.json \
            --evaluation examples/contamination-eval.json \
            --output /tmp/facet-exclusions.jsonl > /tmp/facet-exclusion-evidence.json
          .ci-wheel-check/bin/python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          evidence = json.loads(Path('/tmp/facet-exclusion-evidence.json').read_text())
          raw = Path('/tmp/facet-exclusions.jsonl').read_bytes()
          assert evidence['exclusions_sha256'] == hashlib.sha256(raw).hexdigest()
          assert evidence['matched_embedding_records'] == 1
          PY
          .ci-wheel-check/bin/python - <<'PY'
          import asyncio
          import hashlib
          import importlib.util
          import tempfile
          from pathlib import Path
          from facetroute.live_profile import LiveProfile, LiveProvider, run_live_profile
          from facetroute.public_scores import PublicScoreProvenance
          assert importlib.util.find_spec("httpx") is None
          with tempfile.TemporaryDirectory() as directory:
              source = Path(directory) / "source.jsonl"
              raw = b'{"id":"m1","question":"Pick A","choices":["A","B"],"answer":0,"subject":"demo"}\n'
              source.write_bytes(raw)
              profile = LiveProfile(
                  source, Path(directory) / "checkpoint.json",
                  PublicScoreProvenance("fixture:wheel-preflight", "CC-BY-4.0", hashlib.sha256(raw).hexdigest()),
                  LiveProvider("weak", "upstream-a", "revision-1", "https://weak.example.org/v1", "WEAK_KEY"),
                  LiveProvider("strong", "upstream-b", "revision-1", "https://strong.example.org/v1", "STRONG_KEY"),
              )
              progress = asyncio.run(run_live_profile(profile, environment={}))
              assert progress.completed_calls == 0 and progress.total_calls == 2
          PY
          .ci-wheel-check/bin/facetroute --help
          .ci-wheel-check/bin/facetroute serve --help | grep -- --provider-resilience
