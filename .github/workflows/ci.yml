name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src
      - run: pytest --cov=facetroute --cov-branch
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: ruff check src tests examples
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: mypy -p facetroute
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python -m build
