[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facetroute"
version = "0.2.0"
description = "Offline-first, explainable personalized routing across declared LLM candidates"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Weiping Yan" }]
keywords = ["llm", "routing", "personalization", "bandit", "pareto"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "bandit>=1.7",
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[project.scripts]
facetroute = "facetroute.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
facetroute = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["facetroute"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["facetroute"]
strict = true
warn_unreachable = true

[tool.bandit]
targets = ["src"]
# B101: the only `assert` in this package (benchmark.py `_run_policy`) narrows
# `PolicySpec.fixed_model` for mypy. The invariant it restates is already enforced
# at runtime by `PolicySpec.__post_init__`, which raises ConfigurationError unless
# exactly one of `router`/`fixed_model` is set, so no validation is performed only
# by the assert and stripping it under `python -O` removes no check.
# B311: FacetRoute seeds `random.Random(seed)` deliberately so bootstrap resampling
# and the offline simulator stay reproducible. The package is offline-only with no
# cryptographic surface; `secrets` would break the determinism it is built around.
skips = ["B101", "B311"]
